name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      # CI never uses Ollama or Gemini: mock provider only.
      - run: uv run --frozen pytest -q
        env:
          PP_LLM_PROVIDER: mock
      - name: Tiny mock-provider eval run for plumbing
        run: |
          uv run --frozen python -m patchpilot.evals verify-frozen
          uv run --frozen python -m patchpilot.evals run --pool seeded_train --provider mock --runs 1 --seed 1337 --limit 2
        env:
          PYTHONPATH: src
          PP_LLM_PROVIDER: mock
      - name: Validate compose (core and observability profile)
        run: |
          docker compose config -q
          docker compose --profile observability config -q
