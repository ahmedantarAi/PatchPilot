# Core services have NO profile (start with a plain `docker compose up`).
# Only the observability stack (Langfuse v4) uses `profiles: [observability]`.
# Ollama is NOT here: it runs natively on the Windows host (reach it at host.docker.internal:11434).
#
# Memory budget (mem_limit), hard ceiling 6144 MB total:
#   core:           api 768 + sandbox 768                                   = 1536 MB
#   observability:  web 1024 + worker 768 + clickhouse 1280
#                   + postgres 384 + redis 128 + minio 256                  = 3840 MB
#   total                                                                   = 5376 MB
# Langfuse secrets default to empty so core services start without them; `make obs-up` checks them first.`n# Docker Desktop's WSL2 VM must be allowed >= 6 GB (see README / .wslconfig).

name: patchpilot

services:
  # ---------------- core ----------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 768m
    restart: unless-stopped
    environment:
      PP_LLM_PROVIDER: ${PP_LLM_PROVIDER:-mock}
      PP_OLLAMA_BASE_URL: ${PP_OLLAMA_BASE_URL_IN_DOCKER:-http://host.docker.internal:11434}
      PP_OLLAMA_MODEL: ${PP_OLLAMA_MODEL:-qwen2.5-coder:7b}
      PP_GEMINI_API_KEY: ${PP_GEMINI_API_KEY:-}
      PP_GEMINI_MODEL: ${PP_GEMINI_MODEL:-gemini-2.5-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Untrusted patch/test execution. Not a daemon: invoked per run via
  # `docker compose run --rm sandbox <cmd>` (see SPEC.md section 6). Exits immediately on `up`.
  sandbox:
    build:
      context: ./sandbox
    command: ["true"]
    restart: "no"
    mem_limit: 768m
    memswap_limit: 768m   # no swap
    cpus: 1.0
    pids_limit: 256
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /work:rw,nosuid,size=256m,uid=10001,gid=10001
    working_dir: /work

  # ---------------- observability (Langfuse v4, profile: observability) ----------------
  langfuse-web:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse:4.72.0
    mem_limit: 1024m
    restart: unless-stopped
    depends_on: &langfuse-depends
      langfuse-postgres: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
    ports:
      - "127.0.0.1:3000:3000"
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_HOST:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-}@langfuse-postgres:5432/postgres
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  langfuse-worker:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.72.0
    mem_limit: 768m
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports:
      - "127.0.0.1:3030:3030"
    environment: *langfuse-env

  langfuse-clickhouse:
    profiles: [observability]
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    mem_limit: 1280m
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-postgres:
    profiles: [observability]
    image: docker.io/postgres:17.11-alpine
    mem_limit: 384m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-redis:
    profiles: [observability]
    image: docker.io/redis:7.4.12-alpine
    mem_limit: 128m
    restart: unless-stopped
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_AUTH:-}", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-minio:
    profiles: [observability]
    image: cgr.dev/chainguard/minio:latest   # NOT pinned: see DECISIONS.md D-07 / open questions
    mem_limit: 256m
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
